<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Создание турнира', ~{::section})}">
<section class="narrow">
    <h1 class="mb-4">Создание турнира</h1>
    <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
    <form class="panel p-4" th:action="@{/tournaments/new}" th:object="${tournament}" method="post">
        <label class="form-label mt-3" for="title">Название турнира</label>
        <input class="form-control" type="text" th:field="*{title}" required maxlength="80">

        <label class="form-label mt-3" for="discipline">Дисциплина VR</label>
        <select class="form-select" th:field="*{discipline}">
            <option value="Beat Saber">Beat Saber</option>
            <option value="Eleven">Eleven Table Tennis</option>
            <option value="Creed">Creed</option>
            <option value="Pistol Whip">Pistol Whip</option>
        </select>

        <label class="form-label mt-3" for="format">Формат</label>
        <select class="form-select" th:field="*{format}">
            <option value="1x1">1x1</option>
            <option value="2x2">2x2</option>
            <option value="Группы + плей-офф">Группы + плей-офф</option>
        </select>

        <label class="form-label mt-3" for="date">Дата проведения</label>
        <input class="form-control" type="date" th:field="*{date}" required>

        <button class="btn btn-primary mt-4" type="submit">Создать турнир</button>
    </form>
</section>
</html>
