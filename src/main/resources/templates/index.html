<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <title th:text="${title}">VR-Tourney</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;

            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f7fa;
            color: #000000;
        }
        h1 {
            font-size: 2.5rem;

        p {

<h1 th:text="${title}">VR-Tourney</h1>
<p th:text="${description}">Описание</p>
